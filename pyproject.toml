[project]
name = "djangofirstmr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "django",
    "djangorestframework",
    "drf-spectacular>=0.30.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "radon>=6.0.1",
    "ruff>=0.17.0",
    "typing-extensions>=4.16.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
# Набор правил: базовые ошибки/предупреждения + сортировка импортов + апгрейды и упрощения
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"     # "double" | "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
